services:
  caddy-mon:
    build: .
    image: caddy-mon:local
    container_name: caddy-mon
    restart: unless-stopped
    # Join the same network as caddy-proxy so the DNS name "caddy-proxy" resolves
    networks:
      - caddy_default
    ports:
      - "8080:8080"
    # Caddy access log (for log analytics)
    volumes:
      - ${CADDY_STACK_DIR}/logs:/caddy-logs:ro
      # Caddy TLS certificate files (for expiry monitoring)
      - ${CADDY_STACK_DIR}/certs:/caddy-certs:ro
      # Persistent history SQLite database
      - ./data:/data

networks:
  caddy_default:
    external: true
